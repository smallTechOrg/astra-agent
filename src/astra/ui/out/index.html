<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astra UI</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; align-items: center;
           justify-content: center; height: 100vh; margin: 0; background: #f5f5f5; }
    .box { text-align: center; padding: 2rem; background: white; border-radius: 8px;
           box-shadow: 0 2px 8px rgba(0,0,0,.1); max-width: 480px; }
    h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
    p { color: #666; margin: .5rem 0; }
    code { background: #f0f0f0; padding: .2em .4em; border-radius: 3px; font-size: .9em; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Astra UI</h1>
    <p>The frontend has not been built yet.</p>
    <p>Run <code>scripts/build_ui.sh</code> to build it,<br>
       or use the JSON API directly at <code>/api/</code>.</p>
  </div>
</body>
</html>
